# Render Blueprint — https://render.com/docs/blueprint-spec
# Two services: FastAPI backend + static React frontend.
# Deploy: render.com → New → Blueprint → connect taneesh-8/SettleSense.

services:
  # ---------------------------------------------------------------------
  # Backend — FastAPI (5-stage reconciliation engine)
  # ---------------------------------------------------------------------
  - type: web
    name: settlesense-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: FRONTEND_URL
        sync: false   # set to the deployed frontend's URL once it exists (see README)
      - key: ANTHROPIC_API_KEY
        sync: false   # optional — omit to run Stage 3 on the heuristic fuzzy fallback

  # ---------------------------------------------------------------------
  # Frontend — static Vite/React build
  # ---------------------------------------------------------------------
  - type: web
    name: settlesense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # set to the deployed backend's URL, e.g. https://settlesense-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
